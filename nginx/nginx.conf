worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype font/ttf font/eot font/otf;

    server {
        listen 80;
        server_name durak-na-grani.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name durak-na-grani.ru;
        ssl_certificate /etc/ssl/durak-na-grani.crt;
        ssl_certificate_key /etc/ssl/durak-na-grani.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_trusted_certificate /etc/ssl/ca.crt;
        server_tokens off;

        keepalive_timeout 60;

        root /var/www/html;
        index index.html;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff2|woff|ttf|eot|otf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}